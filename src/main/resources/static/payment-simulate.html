<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng cổng thanh toán</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .pay-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
            padding: 32px;
            width: 380px;
            text-align: center;
        }

        .pay-card h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .method-badge {
            display: inline-block;
            background: #e53637;
            color: #fff;
            border-radius: 14px;
            padding: 3px 14px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .amount {
            font-size: 30px;
            font-weight: 800;
            color: #e53637;
            margin: 10px 0 2px;
        }

        .ref {
            color: #888;
            font-size: 13px;
            margin-bottom: 22px;
            word-break: break-all;
        }

        .note {
            background: #fff7e6;
            border: 1px solid #ffe2a8;
            color: #8a6100;
            border-radius: 6px;
            font-size: 12px;
            padding: 8px 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 6px;
            padding: 13px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-success { background: #28a745; color: #fff; }
        .btn-fail { background: #fff; color: #dc3545; border: 1px solid #dc3545; }
    </style>
</head>

<body>
    <div class="pay-card">
        <h2>Cổng thanh toán (mô phỏng)</h2>
        <div class="method-badge" id="methodName">—</div>
        <div class="amount" id="amount">0₫</div>
        <div class="ref" id="ref"></div>
        <div class="note">
            Đây là trang mô phỏng nội bộ dùng khi hệ thống chưa cấu hình key cổng
            VNPay/MoMo thật. Bấm nút bên dưới để giả lập kết quả thanh toán.
        </div>
        <button type="button" class="btn-success" id="btnOk">✓ Thanh toán thành công</button>
        <button type="button" class="btn-fail" id="btnFail">✗ Thanh toán thất bại / Hủy</button>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var ref = params.get("ref") || "";
            var method = (params.get("method") || "").toUpperCase();
            var amount = Number(params.get("amount") || 0);

            document.getElementById("methodName").textContent = method;
            document.getElementById("amount").textContent = amount.toLocaleString("vi-VN") + "₫";
            document.getElementById("ref").textContent = "Mã giao dịch: " + ref;

            function finish(success) {
                window.location.href = "/api/payments/simulate/" + encodeURIComponent(ref)
                    + "?success=" + success + "&method=" + encodeURIComponent(method);
            }
            document.getElementById("btnOk").addEventListener("click", function () { finish("true"); });
            document.getElementById("btnFail").addEventListener("click", function () { finish("false"); });
        })();
    </script>
</body>

</html>
