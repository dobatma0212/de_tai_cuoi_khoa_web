<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreChain | Lịch sử mua hàng</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap"
    rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/nice-select.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
    <link rel="stylesheet" href="/css/auth.css" type="text/css">
    <style>
        /* Trang lịch sử mua hàng: tab trạng thái + danh sách đơn */
        .order-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .order-tab {
            border: 1px solid #ebebeb;
            background: #fff;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            cursor: pointer;
        }

        .order-tab.active {
            background: #e53637;
            border-color: #e53637;
            color: #fff;
        }

        .order-tab .tab-count {
            display: inline-block;
            min-width: 20px;
            border-radius: 10px;
            background: #f3f3f3;
            color: #444;
            padding: 0 6px;
            font-size: 11px;
            margin-left: 4px;
        }

        .order-tab.active .tab-count {
            background: rgba(255, 255, 255, .3);
            color: #fff;
        }

        .order-card {
            background: #fff;
            border: 1px solid #ebebeb;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .order-card-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .order-items {
            list-style: none;
            padding: 10px 0 4px;
            margin: 0;
            color: #6b6b6b;
            font-size: 13px;
        }

        .order-items li {
            padding: 2px 0;
        }

        .order-ship {
            border-top: 1px dashed #ebebeb;
            padding-top: 8px;
            margin-top: 4px;
            color: #6b6b6b;
        }

        .order-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .order-status-badge {
            display: inline-block;
            border-radius: 10px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: #999;
        }

        .order-status-badge.status-NEW { background: #0d6efd; }
        .order-status-badge.status-CONFIRMED, .order-status-badge.status-PICKED_UP { background: #6610f2; }
        .order-status-badge.status-SHIPPING { background: #fd7e14; }
        .order-status-badge.status-DELIVERED { background: #20c997; }
        .order-status-badge.status-RECEIVED { background: #28a745; }
        .order-status-badge.status-CANCELLED { background: #dc3545; }
        .order-status-badge.status-RETURN_REQUESTED, .order-status-badge.status-RETURNED { background: #e83e8c; }

        .pay-status-badge {
            display: inline-block;
            border-radius: 10px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: #999;
        }

        .pay-status-badge.pay-PAID { background: #28a745; }
        .pay-status-badge.pay-PENDING { background: #f0ad4e; }
        .pay-status-badge.pay-FAILED { background: #dc3545; }
        .pay-status-badge.pay-UNPAID { background: #6c757d; }

        .btn-outline-store {
            border: 1px solid #e53637;
            color: #e53637;
            border-radius: 4px;
        }

        .btn-link-danger { color: #dc3545; }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- Offcanvas Menu Begin -->
    <div class="offcanvas-menu-overlay"></div>
    <div class="offcanvas-menu-wrapper">
        <div class="offcanvas__option">
            <div class="offcanvas__links">
                <a href="/login.html" id="navAuthMobile" class="nav-auth-link">Sign in</a>
            </div>
        </div>
        <div class="offcanvas__nav__option">
            <a href="/shopping-cart.html"><img src="/img/icon/cart.png" alt=""> <span>0</span></a>
        </div>
        <div id="mobile-menu-wrap"></div>
    </div>
    <!-- Offcanvas Menu End -->

    <!-- Header Section Begin -->
    <header class="header">
        <div class="header__top">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6 col-md-7">
                        <div class="header__top__left">
                            <p>Miễn phí giao hàng cho đơn từ 1.000.000₫ — đổi trả trong 30 ngày.</p>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-5">
                        <div class="header__top__right">
                            <div class="header__top__links">
                                <a href="/login.html" id="navAuthDesktop" class="nav-auth-link">Sign in</a>
                                <a href="/profile.html">Tài khoản</a>
                                <a href="/order-history.html">Đơn hàng</a>
                                <a href="/shopping-cart.html">Giỏ hàng</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-lg-3 col-md-3">
                    <div class="header__logo">
                        <a href="/index.html"><img src="/img/logo.png" alt=""></a>
                    </div>
                </div>
                <div class="col-lg-6 col-md-6">
                    <nav class="header__menu mobile-menu">
                        <ul>
                            <li><a href="/index.html">Trang chủ</a></li>
                            <li><a href="/shop.html">Cửa hàng</a></li>
                            <li class="active"><a href="/order-history.html">Đơn hàng</a></li>
                            <li><a href="/contact.html">Liên hệ</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="col-lg-3 col-md-3">
                    <div class="header__nav__option">
                        <a href="/shopping-cart.html"><img src="/img/icon/cart.png" alt=""> <span>0</span></a>
                    </div>
                </div>
            </div>
            <div class="canvas__open"><i class="fa fa-bars"></i></div>
        </div>
    </header>
    <!-- Header Section End -->

    <!-- Breadcrumb Section Begin -->
    <section class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__text">
                        <h4>Lịch sử mua hàng</h4>
                        <div class="breadcrumb__links">
                            <a href="/index.html">Trang chủ</a>
                            <span>Đơn hàng của tôi</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Breadcrumb Section End -->

    <!-- Order History Section Begin -->
    <section class="checkout spad">
        <div class="container">
            <div class="order-tabs" id="orderTabs"></div>
            <p class="text-muted" id="tabSummary" style="font-size:13px;"></p>
            <div id="orderList">Đang tải đơn hàng...</div>
        </div>
    </section>
    <!-- Order History Section End -->

    <!-- Footer Section Begin -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="footer__copyright__text">
                        <p>Copyright &copy; <script>document.write(new Date().getFullYear());</script>
                        StoreChain — Đồ án tốt nghiệp web</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer Section End -->

    <!-- Js Plugins -->
    <script src="/js/jquery-3.3.1.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.nice-select.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/jquery.slicknav.js"></script>
    <script src="/js/mixitup.min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/order-history.js"></script>
</body>

</html>
