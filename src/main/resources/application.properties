# ===============================
# CẤU HÌNH HIBERNATE / JPA
# ===============================
# ddl-auto:
# - update: Tự động cập nhật bảng trong DB theo Entity
# - create / create-drop: Tạo mới lại từ đầu mỗi lần chạy
# - validate: Chỉ kiểm tra cấu trúc
# - none: Không can thiệp DB
spring.jpa.hibernate.ddl-auto=update

# Hiển thị và format câu lệnh SQL trong Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

